<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regional AI Repository · Reset Password</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-forms-panel">
      <div class="auth-forms-inner">
        <div class="brand">
          <div class="brand-logo">
            <svg viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="10" fill="#2563EB"/><path d="M12 28L20 12L28 28" stroke="#fff" stroke-width="2.5"/></svg>
          </div>
          <span class="brand-name">Regional AI Repository</span>
        </div>

        <div class="auth-form active">
          <div class="form-header">
            <h1>Set New Password</h1>
            <p>Enter a new password for your account</p>
          </div>
          <div id="reset-alert" class="alert" style="display:none"></div>

          <form id="reset-form-el" class="form-body" novalidate>
            <input type="hidden" id="token" value="">
            
            <div class="form-group">
              <label for="password" class="form-label">New Password</label>
              <div class="password-wrapper">
                <input type="password" id="password" name="password" class="form-input" placeholder="Min. 8 chars, 1 upper, 1 lower, 1 digit" required minlength="8">
                <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                  <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/></svg>
                </button>
              </div>
              <span class="field-error" id="password-error"></span>
            </div>

            <div class="form-group">
              <label for="confirm-password" class="form-label">Confirm Password</label>
              <div class="password-wrapper">
                <input type="password" id="confirm-password" name="confirm_password" class="form-input" placeholder="Confirm password" required>
              </div>
              <span class="field-error" id="confirm-password-error"></span>
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="reset-btn">
              <span class="btn-text">Reset Password</span>
              <span class="btn-loader" style="display:none"></span>
            </button>
          </form>

          <div class="form-divider"><span>or</span></div>
          <p class="form-footer">Remember password? <a href="auth.html">Sign in</a></p>
        </div>
      </div>
    </div>

    <div class="auth-branding-panel">
      <div class="branding-content">
        <div class="branding-icon">
          <svg viewBox="0 0 120 120" fill="none"><circle cx="60" cy="60" r="56" stroke="rgba(255,255,255,0.2)"/><path d="M40 70L60 30L80 70" stroke="#fff" stroke-width="3"/></svg>
        </div>
        <h2>Regional AI Repository Platform</h2>
        <p>Unify, discover, and collaborate on AI initiatives across organizations and sectors.</p>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "http://127.0.0.1:8000";
    
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    
    if (!token) {
      showAlert('reset-alert', 'Invalid or missing token', 'error');
      document.getElementById('reset-btn').disabled = true;
    } else {
      document.getElementById('token').value = token;
    }

    document.querySelectorAll('.toggle-password').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = btn.parentElement.querySelector('input');
        const eyeOpen = btn.querySelector('.eye-open');
        const eyeClosed = btn.querySelector('.eye-closed');
        if (input.type === 'password') {
          input.type = 'text';
          eyeOpen.style.display = 'none';
          eyeClosed.style.display = 'block';
        } else {
          input.type = 'password';
          eyeOpen.style.display = 'block';
          eyeClosed.style.display = 'none';
        }
      });
    });

    function showAlert(id, msg, type) {
      const el = document.getElementById(id);
      el.className = `alert alert-${type}`;
      el.textContent = msg;
      el.style.display = 'block';
    }

    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      btn.querySelector('.btn-text').style.display = loading ? 'none' : 'inline';
      btn.querySelector('.btn-loader').style.display = loading ? 'inline-block' : 'none';
      btn.disabled = loading;
    }

    document.getElementById('reset-form-el').addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = document.getElementById('token').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (password !== confirmPassword) {
        showAlert('reset-alert', 'Passwords do not match', 'error');
        return;
      }
      if (!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/.test(password)) {
        showAlert('reset-alert', 'Password must be 8+ chars with upper, lower, digit', 'error');
        return;
      }

      setLoading('reset-btn', true);
      try {
        const res = await fetch(`${API_BASE}/api/users/reset-password/${token}`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({password, confirm_password: confirmPassword}),
          mode: 'cors',
          credentials: 'omit'
        });
        const data = await res.json();
        if (res.ok) {
          showAlert('reset-alert', 'Password reset! Redirecting...', 'success');
          setTimeout(() => window.location.href = 'auth.html', 2000);
        } else {
          showAlert('reset-alert', data.detail || 'Invalid or expired token', 'error');
        }
      } catch (err) {
        showAlert('reset-alert', 'Server error. Try again.', 'error');
      } finally {
        setLoading('reset-btn', false);
      }
    });
  </script>
</body>
</html>
