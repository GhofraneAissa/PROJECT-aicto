<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regional AI Repository · Forgot Password</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-forms-panel">
      <div class="auth-forms-inner">
        <div class="brand">
          <div class="brand-logo">
            <svg viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="10" fill="#2563EB"/><path d="M12 28L20 12L28 28" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <span class="brand-name">Regional AI Repository</span>
        </div>

        <div id="forgot-form" class="auth-form active">
          <div class="form-header">
            <h1>Reset Password</h1>
            <p>Enter your email to receive a reset link</p>
          </div>
          <div id="forgot-alert" class="alert" style="display:none"></div>

          <form id="forgot-form-el" class="form-body" novalidate>
            <div class="form-group">
              <label for="email" class="form-label">Email</label>
              <input type="email" id="email" name="email" class="form-input" placeholder="name@org.com" required>
              <span class="field-error" id="email-error"></span>
            </div>
            <button type="submit" class="btn btn-primary btn-full" id="send-btn">
              <span class="btn-text">Send Reset Link</span>
              <span class="btn-loader" style="display:none"></span>
            </button>
          </form>

          <div class="form-divider"><span>or</span></div>
          <p class="form-footer">Remember password? <a href="auth.html">Sign in</a></p>
        </div>
      </div>
    </div>

    <div class="auth-branding-panel">
      <div class="branding-content">
        <div class="branding-icon">
          <svg viewBox="0 0 120 120" fill="none"><circle cx="60" cy="60" r="56" stroke="rgba(255,255,255,0.2)" stroke-width="2"/><path d="M40 70L60 30L80 70" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
        </div>
        <h2>Regional AI Repository Platform</h2>
        <p>Unify, discover, and collaborate on AI initiatives across organizations and sectors.</p>
        <div class="features-list">
          <div class="feature-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
            <span>Centralized AI project repository</span>
          </div>
          <div class="feature-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
            <span>Cross-sector collaboration tools</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "http://127.0.0.1:8000";
    
    function showAlert(id, msg, type) {
      const el = document.getElementById(id);
      el.className = `alert alert-${type}`;
      el.innerHTML = msg;
      el.style.display = 'block';
    }

    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      btn.querySelector('.btn-text').style.display = loading ? 'none' : 'inline';
      btn.querySelector('.btn-loader').style.display = loading ? 'inline-block' : 'none';
      btn.disabled = loading;
    }

    function validateEmail(email) {
      const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return re.test(email);
    }

    document.getElementById('email').addEventListener('input', function() {
      const errorEl = document.getElementById('email-error');
      if (this.value && !validateEmail(this.value)) {
        errorEl.textContent = 'Please enter a valid email address';
      } else {
        errorEl.textContent = '';
      }
    });

    document.getElementById('forgot-form-el').addEventListener('submit', async (e) => {
      e.preventDefault();
      const emailInput = document.getElementById('email');
      const email = emailInput.value.trim();
      
      if (!email) {
        showAlert('forgot-alert', 'Please enter your email address.', 'error');
        emailInput.focus();
        return;
      }

      if (!validateEmail(email)) {
        showAlert('forgot-alert', 'Please enter a valid email address.', 'error');
        emailInput.focus();
        return;
      }

      setLoading('send-btn', true);
      showAlert('forgot-alert', 'Sending reset link...', 'info');
      
      try {
        const res = await fetch(`${API_BASE}/api/users/forgot-password`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({email}),
          mode: 'cors',
          credentials: 'omit'
        });
        
        const data = await res.json();
        
        if (res.ok) {
          showAlert('forgot-alert', 
            '<strong>Check your email!</strong><br>A password reset link has been sent to <strong>' + email + '</strong>.<br>It will expire in 15 minutes.', 
            'success');
          emailInput.disabled = true;
          document.getElementById('send-btn').style.display = 'none';
          document.querySelector('.form-footer').innerHTML = '<a href="auth.html">Back to Sign In</a>';
        } else {
          showAlert('forgot-alert', data.detail || 'Error sending reset link. Please try again.', 'error');
        }
      } catch (err) {
        console.error('Fetch error:', err);
        showAlert('forgot-alert', 'Unable to connect to server. Please check your connection and try again.', 'error');
      } finally {
        setLoading('send-btn', false);
      }
    });
  </script>
</body>
</html>
